<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12141c">
  <title>Pixmino — Web</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><div><h1>Pixmino</h1><p class="subtitle">LÖVE · desktop web edition</p></div><span class="tag">键盘游玩</span></header>
    <section id="player" aria-label="Pixmino 游戏">
      <canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="游戏画面，点击聚焦后使用键盘操作"></canvas>
      <div id="cover">
        <h2 id="heading">准备好了吗？</h2>
        <p id="status" role="status" aria-live="polite">点击开始加载游戏。推荐使用桌面浏览器与键盘。</p>
        <button id="start" type="button">开始游戏</button>
        <button id="reload" type="button" hidden>重新加载</button>
      </div>
    </section>
    <div class="toolbar">
      <p id="save-status" role="status" aria-live="polite">存档将在此浏览器中保存</p>
      <button id="retry-save" type="button" hidden>重试存档</button>
      <button id="temporary" type="button" hidden>临时游玩（不保存）</button>
      <button id="fullscreen" type="button" disabled>全屏 · F4</button>
    </div>
    <p id="notice" role="status"></p>
    <p class="help">点击画面恢复键盘与声音 · F4 切换全屏 · 切换窗口会暂停游戏<br>存档仅保存在当前浏览器和站点。隐私模式、清除网站数据或浏览器限制可能使存档丢失。</p>
    <footer>Powered by <a href="https://love2d.org/">LÖVE</a> / <a href="https://github.com/Davidobot/love.js">love.js 11.4.1</a></footer>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
